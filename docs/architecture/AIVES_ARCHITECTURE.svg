<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1100" viewBox="0 0 1740 1100"><defs><marker id="req" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#2563eb"/></marker><marker id="res" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#0f766e"/></marker></defs><rect width="1740" height="1100" fill="#fff"/><text font-family="Arial, sans-serif" font-size="30" fill="#0f172a" font-weight="700"><tspan x="48" y="62">AIVES / KIẾN TRÚC TỔNG THỂ</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400"><tspan x="50" y="99">React + ASP.NET Core Monolithic + MySQL  •  Đối chiếu code sau khi tích hợp dev  •  21/10/2026</tspan></text><rect x="50" y="236" width="330" height="596" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="14" fill="#2563eb" font-weight="700"><tspan x="72" y="272">01 / FRONTEND</tspan></text><text font-family="Arial, sans-serif" font-size="27" fill="#0f172a" font-weight="700"><tspan x="72" y="319">React SPA</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#334155" font-weight="400"><tspan x="72" y="350">JavaScript JSX · React Router · Vite</tspan></text><rect x="72" y="386" width="286" height="150" rx="10" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700"><tspan x="88" y="414">Giao diện theo vai trò</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#334155" font-weight="400"><tspan x="88" y="442">Giảng viên: môn / lớp / sinh viên</tspan><tspan x="88" y="463">Tài liệu / câu hỏi / kỳ thi / lịch thi</tspan><tspan x="88" y="484">Sinh viên: lịch thi / phòng vấn đáp</tspan><tspan x="88" y="505">Admin: màn hình có sẵn từ dev</tspan></text><rect x="72" y="556" width="286" height="128" rx="10" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700"><tspan x="88" y="584">API &amp; đồng bộ</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#334155" font-weight="400"><tspan x="88" y="612">Fetch + JWT Authorization</tspan><tspan x="88" y="633">SignalR: lịch thi và transcript</tspan><tspan x="88" y="654">Tự kết nối lại / đồng bộ dự phòng</tspan></text><rect x="72" y="704" width="286" height="108" rx="10" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700"><tspan x="88" y="732">Âm thanh trong trình duyệt</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#334155" font-weight="400"><tspan x="88" y="760">Microphone → PCM16 / AudioWorklet</tspan><tspan x="88" y="781">Transcript · nhập tay · phát audio</tspan><tspan x="88" y="802">Không chứa Gemini API key</tspan></text><rect x="550" y="140" width="550" height="772" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="700"><tspan x="572" y="176">02 / BACKEND — MỘT ỨNG DỤNG TRIỂN KHAI</tspan></text><text font-family="Arial, sans-serif" font-size="27" fill="#0f172a" font-weight="700"><tspan x="572" y="225">ASP.NET Core Monolith</tspan></text><text font-family="Arial, sans-serif" font-size="15" fill="#334155" font-weight="400"><tspan x="572" y="260">C# · .NET 10 · REST API + SignalR /hubs/exam</tspan></text><rect x="572" y="293" width="506" height="128" rx="10" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700"><tspan x="588" y="321">Controllers / Hub / Middleware</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#334155" font-weight="400"><tspan x="588" y="349">Users · Courses · Classes · Questions · Exams</tspan><tspan x="588" y="370">LecturerController · WorkflowController · ExamHub</tspan><tspan x="588" y="391">JWT / role / ownership · CORS · xử lý lỗi</tspan></text><rect x="572" y="440" width="506" height="148" rx="10" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700"><tspan x="588" y="468">Nghiệp vụ &amp; tác vụ nền</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#334155" font-weight="400"><tspan x="588" y="496">AuthService · LecturerService · WorkflowService</tspan><tspan x="588" y="517">VivaEngine · DocumentStore · ScheduleNotifications</tspan><tspan x="588" y="538">DeadlineWorker: thời hạn thi / lượt trả lời</tspan><tspan x="588" y="559">Slot tuần tự · trùng lịch · giữ câu đã phân</tspan></text><rect x="572" y="607" width="506" height="126" rx="10" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700"><tspan x="588" y="635">Data / Models / Integrations</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#334155" font-weight="400"><tspan x="588" y="663">AivesDbContext · EF Core 9 · Pomelo MySQL</tspan><tspan x="588" y="684">GeminiViva · GeminiVivaSpeech · GeminiLiveTranscriber</tspan><tspan x="588" y="705">HttpClient / ClientWebSocket · cấu hình &amp; key ở server</tspan></text><rect x="572" y="752" width="506" height="137" rx="10" fill="#f1f5f9" stroke="#dbe4ee" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700"><tspan x="588" y="780">Lưu trữ file riêng trên server</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#334155" font-weight="400"><tspan x="588" y="808">App_Data/Documents hoặc Documents:StorageRoot</tspan><tspan x="588" y="829">PDF / DOCX · tải qua API có kiểm tra quyền</tspan><tspan x="588" y="850">MySQL lưu metadata; không có dịch vụ S3 trong luồng này</tspan></text><rect x="1270" y="140" width="390" height="340" rx="16" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="14" fill="#0f766e" font-weight="700"><tspan x="1292" y="176">03 / DATABASE</tspan></text><text font-family="Arial, sans-serif" font-size="25" fill="#0f172a" font-weight="700"><tspan x="1292" y="223">MySQL · aives_db</tspan></text><text font-family="Arial, sans-serif" font-size="15" fill="#334155" font-weight="400"><tspan x="1292" y="271">users / roles</tspan><tspan x="1292" y="293">courses / academic_classes / class_students</tspan><tspan x="1292" y="315">questions / rubrics / rubric_criteria</tspan><tspan x="1292" y="337">exam_sessions / exam_viva_settings</tspan><tspan x="1292" y="359">exam_candidates / exam_questions</tspan><tspan x="1292" y="381">answers / follow_up_questions / exam_logs</tspan><tspan x="1292" y="403">documents &amp; các bảng mô hình bổ sung</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#0f766e" font-weight="400"><tspan x="1292" y="460">Kết nối EF Core / MySqlConnector · SQL / TCP</tspan></text><rect x="1270" y="565" width="390" height="347" rx="16" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="14" fill="#7e22ce" font-weight="700"><tspan x="1292" y="601">04 / THIRD PARTY</tspan></text><text font-family="Arial, sans-serif" font-size="25" fill="#0f172a" font-weight="700"><tspan x="1292" y="648">Google Gemini API</tspan></text><text font-family="Arial, sans-serif" font-size="15" fill="#334155" font-weight="400"><tspan x="1292" y="695">Live Transcribe: tiếng Việt, PCM streaming</tspan><tspan x="1292" y="717">TTS: tạo audio đọc câu hỏi</tspan><tspan x="1292" y="739">LLM: quyết định câu hỏi đào sâu</tspan><tspan x="1292" y="761"></tspan><tspan x="1292" y="783">REST HTTPS: generateContent</tspan><tspan x="1292" y="805">WSS: Gemini Live qua backend</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#7e22ce" font-weight="400"><tspan x="1292" y="854">LLM khi Nộp: đang TẮT mặc định</tspan><tspan x="1292" y="874">AI:EnableFollowUpOnSubmit = false</tspan><tspan x="1292" y="894">STT / TTS chỉ chạy qua thao tác người dùng</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400"><tspan x="395" y="568">HTTP / JSON</tspan><tspan x="395" y="588">SignalR / WebSocket</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400"><tspan x="1132" y="382">SQL / TCP</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400"><tspan x="1122" y="816">HTTPS / WSS</tspan></text><rect x="50" y="948" width="1610" height="112" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="700"><tspan x="70" y="978">QUY ƯỚC &amp; PHẠM VI</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#64748b" font-weight="400"><tspan x="70" y="1009">Chỉ hai loại mũi tên: Request (xanh dương) và Response (xanh lá). SignalR Response bao gồm sự kiện server push / transcript.</tspan><tspan x="70" y="1030">Frontend chỉ kết nối backend; không truy cập trực tiếp MySQL hoặc Gemini. Các khối bên trong monolith cùng tiến trình, không phải microservices.</tspan><tspan x="70" y="1051">Sơ đồ thể hiện luồng đang nối vào ứng dụng; mã legacy / trang mô phỏng chưa được route không được xem là tích hợp đang hoạt động.</tspan></text><path d="M380,455 H550" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#req)"/><rect x="425" y="430" width="80" height="22" fill="#fff"/><text x="465" y="446" text-anchor="middle" font-family="Arial" font-size="14" fill="#2563eb">Request</text><path d="M550,516 H380" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#res)"/><rect x="425" y="491" width="80" height="22" fill="#fff"/><text x="465" y="507" text-anchor="middle" font-family="Arial" font-size="14" fill="#0f766e">Response</text><path d="M1100,270 H1270" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#req)"/><rect x="1145" y="245" width="80" height="22" fill="#fff"/><text x="1185" y="261" text-anchor="middle" font-family="Arial" font-size="14" fill="#2563eb">Request</text><path d="M1270,332 H1100" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#res)"/><rect x="1145" y="307" width="80" height="22" fill="#fff"/><text x="1185" y="323" text-anchor="middle" font-family="Arial" font-size="14" fill="#0f766e">Response</text><path d="M1100,704 H1270" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#req)"/><rect x="1145" y="679" width="80" height="22" fill="#fff"/><text x="1185" y="695" text-anchor="middle" font-family="Arial" font-size="14" fill="#2563eb">Request</text><path d="M1270,766 H1100" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#res)"/><rect x="1145" y="741" width="80" height="22" fill="#fff"/><text x="1185" y="757" text-anchor="middle" font-family="Arial" font-size="14" fill="#0f766e">Response</text></svg>